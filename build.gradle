plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run-client-validation')
            if (providers.gradleProperty('ciClientValidation').isPresent()) {
                systemProperty 'civitas.validation', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'ci-validation'
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '720'
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file(providers.gradleProperty('ciGameTestDir').getOrElse('run-gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civitas_industria'
        }
        server {
            server()
            gameDirectory = project.file(providers.gradleProperty('ciServerDir').getOrElse('run'))
            if (providers.gradleProperty('ciStaging').isPresent()) systemProperty 'civitas.staging', 'true'
            if (providers.gradleProperty('ciStagingCombined').isPresent()) systemProperty 'civitas.stagingCombined', 'true'
            if (providers.gradleProperty('ciRailwayRestart').isPresent()) systemProperty 'civitas.railwayRestart', providers.gradleProperty('ciRailwayRestart').get()
            if (providers.gradleProperty('ciRailwayRoute').isPresent()) systemProperty 'civitas.railwayRoute', providers.gradleProperty('ciRailwayRoute').get()
            if (providers.gradleProperty('ciSharedRailway').isPresent()) systemProperty 'civitas.sharedRailway', providers.gradleProperty('ciSharedRailway').get()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property('mod_version', project.mod_version)
    inputs.property('neo_version', project.neo_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version, neo_version: project.neo_version)
    }
}

// Forward console commands to the dedicated development server.
tasks.withType(JavaExec).configureEach { standardInput = System.in }

tasks.register('domainTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.civitasindustria.test.DomainTests'
    if (providers.gradleProperty('verifyDomainFailure').isPresent()) args '--verify-failure'
    standardInput = new ByteArrayInputStream(new byte[0])
}
tasks.named('test') {
    dependsOn 'domainTest'
    failOnNoDiscoveredTests = false // Assertions run in the dependency-free domainTest harness.
}
tasks.named('check') { dependsOn 'domainTest' }
tasks.register('ecologyBalanceReport', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.civitasindustria.test.EcologyBalanceReport'
    standardInput = new ByteArrayInputStream(new byte[0])
}

// Optional runtime integration; compile against the exact lockfile artifact downloaded on the build server.
dependencies {
    def createArtifact = file(providers.gradleProperty('ciArtifactDirectory').getOrElse('../civitas-industria-artifacts') + '/create-1.21.1-6.0.10.jar')
    compileOnly files(createArtifact)
    compileOnly files(providers.gradleProperty('ciArtifactDirectory').getOrElse('../civitas-industria-artifacts') + '/ImmersiveEngineering-1.21.1-12.4.2-194.jar')
    compileOnly files(providers.gradleProperty('ciArtifactDirectory').getOrElse('../civitas-industria-artifacts') + '/AdPother-1.21.1-9.1.10.0-NeoForge-build.1121.jar')
    compileOnly files(providers.gradleProperty('ciArtifactDirectory').getOrElse('../civitas-industria-artifacts') + '/ForgeEndertech-1.21.1-12.1.3.0-NeoForge-build.1100.jar')
    // Public Create test APIs inherit types from these exact bundled libraries.
    compileOnly files(zipTree(createArtifact).matching { include 'META-INF/jarjar/*.jar' })
}
