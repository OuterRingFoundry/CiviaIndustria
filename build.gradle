plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property('mod_version', project.mod_version)
    inputs.property('neo_version', project.neo_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version, neo_version: project.neo_version)
    }
}

// Forward console commands to the dedicated development server.
tasks.withType(JavaExec).configureEach { standardInput = System.in }

tasks.register('domainTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.civitasindustria.test.DomainTests'
    if (providers.gradleProperty('verifyDomainFailure').isPresent()) args '--verify-failure'
    standardInput = new ByteArrayInputStream(new byte[0])
}
tasks.named('test') {
    dependsOn 'domainTest'
    failOnNoDiscoveredTests = false // Assertions run in the dependency-free domainTest harness.
}
tasks.named('check') { dependsOn 'domainTest' }
