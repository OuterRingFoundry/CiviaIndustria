plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '0.1.0'
group = 'com.outerringfoundry'
base { archivesName = 'aew-map-survey' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
if (providers.gradleProperty('surveyValidation').isPresent()) {
    sourceSets.main.java.srcDir('src/validation/java')
}
neoForge {
    version = '21.1.248'
    runs {
        client {
            client()
            gameDirectory = file(providers.gradleProperty('surveyRunDir').getOrElse('run-client'))
            if (providers.gradleProperty('surveyValidation').isPresent()) {
                systemProperty 'aew.surveyValidation', 'true'
                systemProperty 'sun.net.client.defaultConnectTimeout', '5000'
                systemProperty 'sun.net.client.defaultReadTimeout', '5000'
                programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25594', '--username', 'SurveyTester', '--width', '1280', '--height', '720')
            }
        }
    }
    mods { aew_map_survey { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.register('surveyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.outerringfoundry.mapsurvey.SurveyTests'
}
tasks.named('test') { dependsOn 'surveyTest'; failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn 'surveyTest' }
