name: Phase 0 validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew clean
      - run: bash ./gradlew compileJava
      - run: bash ./gradlew test
      - run: bash ./gradlew build
      - name: Dedicated server and command smoke test (no optional mods)
        run: python3 scripts/smoke-server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-0-results
          path: |
            build/libs/*.jar
            build/reports/
            build/smoke/
            run/logs/
