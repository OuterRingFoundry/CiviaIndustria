name: Development integration validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned compile and integration dependencies
        run: python scripts/download-pack.py --directory ../civitas-industria-artifacts --output-lock "$RUNNER_TEMP/downloaded-mods.lock.json"
      - name: Verify upstream artifacts against the committed lock
        run: python scripts/verify-pack.py --directory ../civitas-industria-artifacts --side client --all-artifacts
      - name: Fetch compile-only legacy pollution API
        run: python scripts/download-pack.py --lock pack/compile-extra.lock.json --directory ../civitas-industria-artifacts --output-lock "$RUNNER_TEMP/compile-extra.lock.json"
      - name: Tooling and content checks
        run: |
          python scripts/check-tooling.py
          python scripts/validate-content.py
      - name: Clean build and mandatory domain tests
        run: bash ./gradlew --no-daemon clean compileJava test build
      - name: Core and focused dedicated-server GameTest profiles
        run: python scripts/integration-matrix.py --artifacts ../civitas-industria-artifacts
      - name: Render menus and validate client packets
        run: python scripts/test-redesign-client.py --fixture run-matrix-full-server --output build/redesign-client
      - name: Currency process restart and damaged-save refusal
        run: python scripts/test-economy-restart.py --fixture run-matrix-core --output build/economy-restart
      - name: Assemble focused installer
        run: python scripts/package-focused.py --civitas build/libs/civitas_industria-0.5.0-dev.jar --output build/distribution
      - name: Three-dimension persistence and damaged-save refusal
        run: |
          python scripts/smoke-server.py --runtime-write
          cp build/smoke/server.log build/smoke/write.log
          python scripts/smoke-server.py --runtime-read
          cp build/smoke/server.log build/smoke/read.log
          python scripts/check-save-refusal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-validation
          retention-days: 14
          path: |
            build/libs/*.jar
            build/reports/
            build/smoke/
            run/logs/
            run-matrix-*/matrix.log
            pack/integration-results.json
            build/save-refusal/
            build/economy-restart/*.log
            build/economy-restart/*results.json
            build/redesign-client/client-validation.log
            build/redesign-client/result.json
            build/redesign-client/screenshots/
            build/distribution/
